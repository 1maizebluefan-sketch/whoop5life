name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  swift-packages:
    name: Swift Packages
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test WhoopProtocol
        run: swift test --package-path Packages/WhoopProtocol

      - name: Test WhoopStore
        run: swift test --package-path Packages/WhoopStore

  ios-build:
    name: iOS App Build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create local config
        working-directory: ios
        run: cp OpenWhoop/Config/Secrets.example.xcconfig OpenWhoop/Config/Secrets.xcconfig

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build LifeStrap
        working-directory: ios
        run: >
          xcodebuild
          -project LifeStrap.xcodeproj
          -scheme LifeStrap
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          build
